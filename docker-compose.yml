services:
  postgres:
    image: postgres:17-alpine
    container_name: name-table-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: name_app
      POSTGRES_USER: name_app
      POSTGRES_PASSWORD: name_app_password
    ports:
      - "5432:5432"
    volumes:
      - name_table_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U name_app -d name_app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  name_table_postgres_data:
